services:
  postgres:
    image: postgres:16-alpine
    container_name: sinarpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinarpay
      POSTGRES_PASSWORD: sinarpay_password
      POSTGRES_DB: sinarpay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinarpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sinarpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: sinarpay-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://sinarpay:sinarpay_password@postgres:5432/sinarpay_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: sinarpay_super_secret_jwt_key_32bytes_minimum_length_required!
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: sinarpay_super_secret_refresh_key_32bytes_minimum!
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BANK_CALLBACK_SECRET: sinarpay_bank_simulator_secret_key_123
      WEBHOOK_MAX_RETRIES: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
